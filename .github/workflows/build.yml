name: Build firmware

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach firmware to releases on tags

env:
  ADAFRUIT_INDEX: https://adafruit.github.io/arduino-board-index/package_adafruit_index.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      # Versions pinned to the ones the firmware was last built and checked against.
      - name: Install board package and libraries
        run: |
          arduino-cli core update-index --additional-urls "$ADAFRUIT_INDEX"
          arduino-cli core install adafruit:samd@1.7.17 --additional-urls "$ADAFRUIT_INDEX"
          arduino-cli lib install \
            "Adafruit TinyUSB Library@3.8.1" \
            "Adafruit NeoPixel@1.15.5" \
            "Adafruit FreeTouch Library@1.1.3" \
            "Adafruit APDS9960 Library@1.3.1"

      # The board and TinyUSB stack come from firmware/Tarsier/sketch.yaml.
      - name: Compile
        run: arduino-cli compile --warnings all --output-dir build firmware/Tarsier

      - name: Make UF2
        run: python3 tools/bin2uf2.py build/Tarsier.ino.bin build/Tarsier.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: Tarsier-firmware
          path: |
            build/Tarsier.uf2
            build/Tarsier.ino.bin

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Tarsier.uf2
            build/Tarsier.ino.bin
